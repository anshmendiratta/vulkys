[package]
name = "vulkys"
version = "0.1.0"
edition = "2024"

[lib]
name = "vulkys"           
path = "src/lib.rs"    
test = true            
doctest = true         
bench = true           
doc = true             
edition = "2021"       
crate-type = ["lib"]   

[dependencies]
# gui
egui = "0.21.0"
eframe = "0.21.3"
# vulkan and related
vulkano = "0.34.1"
vulkano-shaders = "0.34.0"
winit = { version = "0.28.0", default-features = true }
image = "0.24"
bytemuck = { version ="1.20.0", features = ["derive"] }
# util
anyhow = "1.0.93"
tracing-subscriber = "0.3"
tracing = "0.1.40"
libm = "0.2.6"
ecolor = { version = "0.29.1", features = ["serde"] }
tokio = { version = "1.43.0", features = ["rt"]}
tokio-macros = "2.5.0"
nalgebra = "0.33.2"
nalgebra-glm = { version = "0.19.0", features = ["convert-bytemuck"] }
rapier3d = {version = "0.27.0", features = ["simd-stable"]}

[profile.dev]
kpt-level = 3
