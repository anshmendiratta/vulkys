[package]
name = "vulkys"
version = "0.1.0"
edition = "2024"

[lib]
name = "vulkys"           
path = "src/lib.rs"    
test = true            
doctest = true         
bench = true           
doc = true             
crate-type = ["lib"]   

[dependencies]
# vulkan and related
vulkano = "0.35.1"
vulkano-shaders = "0.34.0"
winit = { version = "0.30.0", default-features = true }
image = "0.24"
bytemuck = { version ="1.20.0", features = ["derive"] }
# util
anyhow = "1.0.93"
tracing-subscriber = "0.3"
tracing = "0.1.40"
ecolor = { version = "0.29.1", features = ["serde"] }
nalgebra = "0.33.2"
nalgebra-glm = { version = "0.19.0", features = ["convert-bytemuck"] }
rapier3d = {version = "0.27.0", features = ["simd-stable"]}
obj-rs = "0.7.4"

[profile.dev]
opt-level = 3
